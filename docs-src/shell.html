<!doctype html>
<!-- generated by tools/build-docs.ts from docs-src/ -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{DOCUMENT_TITLE}}</title>
  <link rel="stylesheet" href="{{MICA_CSS}}" />
{{SCRIPTS}}
  <link rel="stylesheet" href="{{SITE_CSS}}" />
</head>
<body>
  <a class="skip" href="#main" data-visually-hidden="focusable">Skip to content</a>
  <m-sidebar-layout variant="docked">
    <m-sidebar id="docs-navigation" role="complementary" aria-label="Documentation sidebar">
      <header role="presentation">
        <a class="brand" data-sidebar-item href="{{HOME_HREF}}">mica</a>
        <button data-variant="ghost" type="button" data-sidebar-close aria-label="Close navigation">×</button>
      </header>
      <nav aria-label="Documentation">
        {{NAV}}
      </nav>
    </m-sidebar>
    <div data-sidebar-main>
      <header class="docs-toolbar">
        <a class="brand" href="{{HOME_HREF}}">mica</a>
        <button data-variant="ghost" type="button" data-sidebar-toggle aria-controls="docs-navigation" aria-expanded="false">Navigation</button>
      </header>
      <main id="main" class="docs-content" tabindex="-1">
      <m-center style="--max: 62rem">
        <m-vstack gap="xl">
          <header class="page-header">
            <m-vstack gap="2xs">
              <h1>{{PAGE_TITLE}}</h1>
              <p class="lead">{{LEAD}}</p>
            </m-vstack>
          </header>
{{BODY}}{{PAGER}}
        </m-vstack>
      </m-center>
      </main>
    </div>
    <dialog data-sidebar-dialog aria-label="Documentation navigation"></dialog>
  </m-sidebar-layout>
  <script type="module">
    await customElements.whenDefined('m-sidebar-layout');
    const navigation = document.querySelector('#docs-navigation > nav');
    const current = navigation.querySelector('[aria-current="page"]');
    const revealCurrent = () => requestAnimationFrame(() => {
      if (!current || !navigation.getClientRects().length) return;
      const navRect = navigation.getBoundingClientRect();
      const linkRect = current.getBoundingClientRect();
      if (linkRect.top < navRect.top || linkRect.bottom > navRect.bottom) {
        navigation.scrollTop += linkRect.top - navRect.top - (navRect.height - linkRect.height) / 2;
      }
    });
    revealCurrent();
    new MutationObserver(revealCurrent).observe(
      document.querySelector('dialog[data-sidebar-dialog]'),
      { attributes: true, attributeFilter: ['open'] },
    );
  </script>
</body>
</html>

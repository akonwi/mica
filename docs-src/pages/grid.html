<section><m-vstack gap="md"><h2>Example</h2><div class="specimen"><m-grid gap="md" min="xs"><div class="card tall">1</div><div class="card tall">2</div><div class="card tall">3</div><div class="card tall">4</div></m-grid></div></m-vstack></section>
<section><m-vstack gap="md"><h2>Basic usage</h2><pre><code>&lt;m-grid gap=&quot;md&quot; min=&quot;sm&quot;&gt;…&lt;/m-grid&gt;</code></pre></m-vstack></section>
<section><m-vstack gap="lg"><m-vstack gap="2xs"><h2>API</h2><p class="lead">Columns pack to fit without media queries.</p></m-vstack><div class="api-block"><h3>Attributes</h3><table class="api-table"><thead><tr><th>Name</th><th>Type/Values</th><th>Default</th><th>Description</th></tr></thead><tbody>

<tr><td><code>min</code></td><td><code>xs</code> · <code>sm</code> · <code>md</code> · <code>lg</code></td><td><code>sm</code></td><td>Sets the minimum column width.</td></tr>
</tbody></table></div></m-vstack></section>

<h2>Attributes</h2>
<p><code>gap</code>; <code>side="end"</code> makes the <em>last</em> child the
sidecar (no visual reordering); <code>side-width</code>: xs · sm · md.
The markup contract: exactly two children, first (or last) is the fixed one.</p>

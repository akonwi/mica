<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — Fieldwork</title><link rel="stylesheet" href="../mica.css"><script src="appearance.js"></script><script type="module" src="../sidebar.js"></script><style>body{margin:0}m-sidebar>header{display:grid;grid-template-columns:1fr auto;gap:var(--space-2xs)}m-sidebar>header small{grid-column:1}m-sidebar>header [data-sidebar-close]{grid-column:2;grid-row:1 / 3}a{color:var(--color-text);text-decoration-color:var(--color-border);text-underline-offset:.2em}a:hover{text-decoration-color:currentColor}m-sidebar-layout{min-height:100vh;--sidebar-width:11rem}.content{min-width:0}.bar{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) var(--space-lg);border-bottom:1px solid var(--color-border)}.bar small{color:var(--color-text-muted)}.bar m-avatar{margin-left:auto}main{padding:var(--space-xl) var(--space-lg);max-width:70rem;margin:auto}h1{font-size:1.8rem;letter-spacing:-.04em;margin:0}h2{font-size:1rem;margin:0}p{margin:0}small,.muted{color:var(--color-text-muted);font-size:.8125rem}.title{display:flex;justify-content:space-between;align-items:center;gap:var(--space-md);margin-bottom:var(--space-xl)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-md);margin-bottom:var(--space-xl)}.stats strong{display:block;font-size:2rem;letter-spacing:-.04em}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--space-lg);align-items:start}.stack{display:grid;gap:var(--space-lg)}.row{display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap}.field{display:grid;gap:var(--space-xs)}form{display:grid;gap:var(--space-lg)}.form-row{display:flex;justify-content:space-between;align-items:center;gap:var(--space-lg)}.form-row span{display:grid;gap:var(--space-xs)}.status{min-height:1.5em;color:var(--color-text-muted);font-size:.8125rem}progress{width:100%}table{width:100%}th,td{white-space:nowrap}.table-wrap{overflow:auto}.tools{display:flex;gap:var(--space-sm);flex-wrap:wrap}.tools input{flex:1;min-width:8rem}.pages{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);flex-wrap:wrap}.bulk{min-height:2.75rem;display:flex;align-items:center;gap:var(--space-sm)}textarea{width:100%}a{overflow-wrap:anywhere}@media(max-width:650px){main{padding:var(--space-lg) var(--space-md)}.split{grid-template-columns:1fr}.stats{grid-template-columns:1fr;gap:var(--space-xs)}.stats m-card-body{display:flex;align-items:center;gap:var(--space-md)}.stats m-card-body>small:first-child{flex:1}.stats m-card-body>small:last-child{display:none}.stats m-card-body{--card-pad:var(--space-sm)}.stats strong{font-size:1.5rem}.title{align-items:start;flex-direction:column}.bar{padding-inline:var(--space-md)}}</style></head><body><m-sidebar-layout variant="docked"><m-sidebar id="workspace-nav" role="complementary" aria-label="Workspace sidebar"><header role="presentation"><strong>Fieldwork</strong><small>Studio workspace</small><button type="button" data-sidebar-close aria-label="Close navigation">×</button></header><nav aria-label="Workspace"><a data-sidebar-item href="recipe-overview.html">Overview</a><a data-sidebar-item href="recipe-projects.html">Projects</a><a data-sidebar-item href="recipe-detail.html">Project detail</a><a data-sidebar-item href="recipe-settings.html" aria-current="page">Settings</a></nav><footer role="presentation"><small>Alex Morgan<br>Personal workspace</small></footer></m-sidebar><div class="content" data-sidebar-main><header class="bar"><button data-sidebar-toggle aria-controls="workspace-nav" aria-label="Toggle navigation">☰</button><small>Workspace / Settings</small><m-avatar aria-label="Alex Morgan" role="img">AM</m-avatar></header><main><div class="title"><div><h1>Workspace settings</h1><p class="muted">A few details to make this space yours.</p></div></div><form data-save><m-card><m-card-header><div><h2>General</h2><p>The name and defaults your team sees.</p></div></m-card-header><m-card-body><div class="stack"><label class="field">Workspace name<input value="Fieldwork studio" required></label><label class="field">Weekly digest<select><option>Every Monday</option><option>Every Friday</option><option>Never</option></select></label></div></m-card-body></m-card><m-card><m-card-header><h2>Notifications</h2></m-card-header><m-card-body><div class="stack"><label class="form-row"><span>Project updates<small>Milestones and status changes.</small></span><input type="checkbox" role="switch" checked></label><label class="form-row"><span>Team mentions<small>A heads-up when someone needs you.</small></span><input type="checkbox" role="switch" checked></label><label class="row"><input type="checkbox">Include activity summaries in email</label></div></m-card-body></m-card><div class="row"><button data-variant="primary">Save changes</button><button type="reset">Reset</button></div><p id="status" class="status" role="status"></p></form></main></div><dialog data-sidebar-dialog aria-label="Workspace navigation"></dialog></m-sidebar-layout><script>
const status=document.querySelector('#status');
document.querySelector('form[data-save]')?.addEventListener('submit',e=>{e.preventDefault();status.textContent='Changes saved in this preview.'});
document.querySelector('#note-form')?.addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#note'),li=document.createElement('li'),body=document.createElement('div'),p=document.createElement('p'),small=document.createElement('small');body.dataset.listBody='';p.textContent=input.value;small.textContent='Alex Morgan · Just now';body.append(p,small);li.append(body);document.querySelector('#notes').prepend(li);input.value='';status.textContent='Note added in this preview.'});
let page=1;const rows=[...document.querySelectorAll('tbody tr')];
function render(){const q=document.querySelector('#search').value.toLowerCase(),state=document.querySelector('#state').value;const matches=rows.filter(r=>r.textContent.toLowerCase().includes(q)&&(!state||r.dataset.state===state));const max=Math.max(1,Math.ceil(matches.length/5));page=Math.min(page,max);rows.forEach(r=>{r.hidden=!matches.slice((page-1)*5,page*5).includes(r);r.querySelector('input').checked=false});document.querySelector('#range').textContent=matches.length?`${(page-1)*5+1}–${Math.min(page*5,matches.length)} of ${matches.length}`:'No projects found';document.querySelector('#prev').disabled=page===1;document.querySelector('#next').disabled=page===max;selection()}
function selection(){const n=rows.filter(r=>r.querySelector('input').checked).length;document.querySelector('#selection').textContent=n?`${n} selected on this page`:'Select projects to update their status';document.querySelector('#complete').disabled=!n}
if(rows.length){document.querySelector('#search').oninput=()=>{page=1;render()};document.querySelector('#state').onchange=()=>{page=1;render()};document.querySelector('#prev').onclick=()=>{page--;render()};document.querySelector('#next').onclick=()=>{page++;render()};rows.forEach(r=>r.querySelector('input').onchange=selection);document.querySelector('#complete').onclick=()=>{rows.filter(r=>r.querySelector('input').checked).forEach(r=>{r.dataset.state='Completed';r.querySelector('[data-state-label]').textContent='Completed'});render()};render()}
</script></body></html>
